<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f0f4f8"/>
  
  <!-- Decorative header -->
  <rect width="800" height="120" fill="#1a6e4d"/>
  
  <!-- Title -->
  <text x="400" y="70" font-size="36" font-weight="bold" text-anchor="middle" fill="white">
    ফটো ও কার্যক্রম অ্যালবাম
  </text>
  
  <!-- Gallery grid background -->
  <g id="gallery-grid">
    <!-- Image 1 -->
    <rect x="50" y="160" width="220" height="180" fill="#e8f5e9" stroke="#1a6e4d" stroke-width="2" rx="8"/>
    <circle cx="160" cy="240" r="30" fill="#1a6e4d" opacity="0.3"/>
    <text x="160" y="320" font-size="14" text-anchor="middle" fill="#666">কার্যক্রম ১</text>
    
    <!-- Image 2 -->
    <rect x="290" y="160" width="220" height="180" fill="#e3f2fd" stroke="#1a6e4d" stroke-width="2" rx="8"/>
    <circle cx="400" cy="240" r="30" fill="#1a6e4d" opacity="0.3"/>
    <text x="400" y="320" font-size="14" text-anchor="middle" fill="#666">কার্যক্রম ২</text>
    
    <!-- Image 3 -->
    <rect x="530" y="160" width="220" height="180" fill="#f3e5f5" stroke="#1a6e4d" stroke-width="2" rx="8"/>
    <circle cx="640" cy="240" r="30" fill="#1a6e4d" opacity="0.3"/>
    <text x="640" y="320" font-size="14" text-anchor="middle" fill="#666">কার্যক্রম ৩</text>
    
    <!-- Image 4 -->
    <rect x="50" y="370" width="220" height="180" fill="#fff3e0" stroke="#1a6e4d" stroke-width="2" rx="8"/>
    <circle cx="160" cy="450" r="30" fill="#1a6e4d" opacity="0.3"/>
    <text x="160" y="530" font-size="14" text-anchor="middle" fill="#666">কার্যক্রম ৪</text>
    
    <!-- Image 5 -->
    <rect x="290" y="370" width="220" height="180" fill="#fce4ec" stroke="#1a6e4d" stroke-width="2" rx="8"/>
    <circle cx="400" cy="450" r="30" fill="#1a6e4d" opacity="0.3"/>
    <text x="400" y="530" font-size="14" text-anchor="middle" fill="#666">কার্যক্রম ৫</text>
    
    <!-- Image 6 -->
    <rect x="530" y="370" width="220" height="180" fill="#e0f2f1" stroke="#1a6e4d" stroke-width="2" rx="8"/>
    <circle cx="640" cy="450" r="30" fill="#1a6e4d" opacity="0.3"/>
    <text x="640" y="530" font-size="14" text-anchor="middle" fill="#666">কার্যক্রম ৬</text>
  </g>
</svg>